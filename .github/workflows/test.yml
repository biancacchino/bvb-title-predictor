name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # the oldest version the README promises, so CI catches newer-only syntax
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
